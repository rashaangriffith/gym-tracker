<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Gym Tracker</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #efefec;
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #9b9b96;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.2);
    --teal: #0F6E56;
    --teal-bg: #E1F5EE;
    --teal-border: #5DCAA5;
    --purple: #3C3489;
    --purple-bg: #EEEDFE;
    --purple-border: #AFA9EC;
    --coral: #993C1D;
    --coral-bg: #FAECE7;
    --amber-bg: #FAEEDA;
    --amber: #854F0B;
    --blue: #185FA5;
    --blue-bg: #E6F1FB;
    --radius: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #252523;
      --bg3: #2e2e2b;
      --text: #e8e8e4;
      --text2: #9b9b96;
      --text3: #6b6b67;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --teal: #5DCAA5;
      --teal-bg: #04342C;
      --teal-border: #0F6E56;
      --purple: #AFA9EC;
      --purple-bg: #26215C;
      --purple-border: #534AB7;
      --coral: #F0997B;
      --coral-bg: #4A1B0C;
      --amber-bg: #412402;
      --amber: #EF9F27;
      --blue: #85B7EB;
      --blue-bg: #042C53;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.4; }

  .app { max-width: 430px; margin: 0 auto; padding: 0 0 env(safe-area-inset-bottom, 16px); }

  /* Header */
  .header { padding: 16px 16px 0; display: flex; justify-content: space-between; align-items: baseline; }
  .header-title { font-size: 22px; font-weight: 600; color: var(--text); }
  .header-sub { font-size: 13px; color: var(--text2); }

  /* Day tabs */
  .day-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 16px 0; }
  .tab-btn { padding: 10px 4px 8px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg); font-size: 14px; font-weight: 500; color: var(--text2); cursor: pointer; text-align: center; line-height: 1.3; transition: background 0.15s, border-color 0.15s; }
  .tab-btn.active { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tab-day { font-size: 11px; font-weight: 400; display: block; margin-top: 2px; opacity: 0.8; }

  /* Session */
  .session { padding: 14px 16px 0; }
  .session-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; color: var(--text3); text-transform: uppercase; margin-bottom: 12px; }

  /* Exercise card */
  .ex-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 12px; overflow: hidden; }
  .ex-header { padding: 14px 14px 10px; }
  .ex-cat-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-push { background: var(--purple); }
  .dot-pull { background: var(--teal); }
  .dot-hinge { background: var(--coral); }
  .ex-cat { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--text2); text-transform: uppercase; }
  .ex-name { font-size: 18px; font-weight: 600; color: var(--text); }

  .ex-params { display: flex; gap: 6px; padding: 0 14px 10px; flex-wrap: wrap; }
  .param-pill { font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 0.5px solid var(--border); color: var(--text2); background: var(--bg2); white-space: nowrap; }
  .param-pill.accent { background: var(--purple-bg); border-color: var(--purple-border); color: var(--purple); }

  .ex-note { font-size: 13px; color: var(--text2); padding: 0 14px 12px; line-height: 1.5; }

  /* Sets */
  .sets-section { border-top: 0.5px solid var(--border); padding: 12px 14px 14px; }
  .sets-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .sets-title { font-size: 12px; font-weight: 500; color: var(--text2); }
  .sets-reset { font-size: 12px; color: var(--text3); cursor: pointer; border: none; background: none; padding: 4px 0; color: var(--text2); }
  .set-rows { display: flex; flex-direction: column; gap: 8px; }
  .set-row { display: flex; align-items: center; gap: 8px; }
  .set-num { font-size: 13px; color: var(--text3); width: 16px; flex-shrink: 0; text-align: center; }
  .set-check { width: 44px; height: 44px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s, border-color 0.15s; font-size: 20px; }
  .set-check.done { background: var(--teal-bg); border-color: var(--teal-border); }
  .set-check.done::after { content: '✓'; color: var(--teal); font-weight: 600; }
  .set-input { flex: 1; height: 44px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg2); font-size: 15px; color: var(--text); padding: 0 10px; text-align: center; appearance: none; -webkit-appearance: none; }
  .set-input:focus { outline: none; border-color: var(--border2); }
  .set-input::placeholder { color: var(--text3); }
  .set-sep { font-size: 13px; color: var(--text3); width: 14px; text-align: center; flex-shrink: 0; }

  /* Rest timer */
  .rest-bar { background: var(--bg2); border-top: 0.5px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .rest-label { font-size: 13px; color: var(--text2); flex: 1; }
  .rest-btn { font-size: 13px; padding: 8px 12px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .rest-btn.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
  .timer-display { font-size: 20px; font-weight: 600; color: var(--text); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .timer-done { color: var(--teal); }

  /* Done banner */
  .done-banner { background: var(--teal-bg); border: 0.5px solid var(--teal-border); border-radius: var(--radius); padding: 12px 14px; margin-top: 4px; display: none; align-items: center; gap: 10px; }
  .done-banner.show { display: flex; }
  .done-icon { font-size: 20px; }
  .done-text { font-size: 14px; font-weight: 500; color: var(--teal); }

  /* History panel */
  .history-toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; cursor: pointer; }
  .history-toggle-label { font-size: 13px; font-weight: 500; color: var(--text2); }
  .history-toggle-icon { font-size: 18px; color: var(--text3); transition: transform 0.2s; }
  .history-toggle-icon.open { transform: rotate(180deg); }
  .history-panel { padding: 10px 16px 0; display: none; }
  .history-panel.open { display: block; }
  .history-entry { background: var(--bg2); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
  .history-date { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .history-row { font-size: 13px; color: var(--text2); padding: 2px 0; }
  .history-empty { font-size: 13px; color: var(--text3); padding: 8px 0; }

  /* Footer */
  .footer { padding: 20px 16px 8px; text-align: center; }
  .clear-btn { font-size: 13px; color: var(--text3); border: none; background: none; cursor: pointer; padding: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-title">Gym Tracker</div>
    <div class="header-sub" id="today-label"></div>
  </div>

  <div class="day-tabs">
    <button class="tab-btn" onclick="showDay(0)" id="tab0">Session A<span class="tab-day">Monday</span></button>
    <button class="tab-btn" onclick="showDay(1)" id="tab1">Session B<span class="tab-day">Wednesday</span></button>
    <button class="tab-btn" onclick="showDay(2)" id="tab2">Session C<span class="tab-day">Friday</span></button>
  </div>

  <div id="day0" class="session" style="display:none;"></div>
  <div id="day1" class="session" style="display:none;"></div>
  <div id="day2" class="session" style="display:none;"></div>

  <div class="history-toggle" onclick="toggleHistory()">
    <span class="history-toggle-label">Previous sessions</span>
    <span class="history-toggle-icon" id="hist-icon">▾</span>
  </div>
  <div class="history-panel" id="hist-panel"></div>

  <div class="footer">
    <button class="clear-btn" onclick="clearHistory()">Clear all history</button>
  </div>
</div>

<script>
const DAYS = [
  {
    label: 'Monday · Session A · Strength focus',
    exercises: [
      { cat: 'push', name: 'Barbell bench press', sets: 4, reps: '4–6', rpe: 'RPE 9', rest: 210, restLabel: '3.5 min', note: 'Deep stretch, bar to chest on every rep.' },
      { cat: 'pull', name: 'Weighted pull-up',    sets: 4, reps: '4–6', rpe: 'RPE 9', rest: 210, restLabel: '3.5 min', note: 'Full dead hang at bottom of every rep.' },
      { cat: 'hinge', name: 'Trap bar deadlift',  sets: 3, reps: '3–5', rpe: 'RPE 9', rest: 210, restLabel: '3.5 min', note: '' },
    ]
  },
  {
    label: 'Wednesday · Session B · Hypertrophy focus',
    exercises: [
      { cat: 'push', name: 'Dumbbell press',   sets: 3, reps: '8–12', rpe: 'RPE 12', rest: 90,  restLabel: '90 s', note: 'Deep stretch past chest level.' },
      { cat: 'pull', name: 'Lat pull-down',    sets: 3, reps: '8–12', rpe: 'RPE 12', rest: 90,  restLabel: '90 s', note: 'Full stretch at the top of every rep.' },
      { cat: 'hinge', name: 'Romanian deadlift', sets: 3, reps: '8–12', rpe: 'RPE 12', rest: 90, restLabel: '90 s', note: '' },
    ]
  },
  {
    label: 'Friday · Session C · Mixed',
    exercises: [
      { cat: 'push', name: 'Weighted dip',     sets: 4, reps: '6–8',  rpe: 'RPE 9',  rest: 210, restLabel: '3.5 min', note: 'Full range, deep stretch at the bottom.' },
      { cat: 'pull', name: 'Pull-up cluster',  sets: 5, reps: '3',    rpe: '15 s intra', rest: 15,  restLabel: '15 s intra', altRestLabel: '2 min between clusters', altRest: 120, note: 'Full dead hang every rep. 15 s rest between mini-sets within each cluster.' },
      { cat: 'hinge', name: 'Single-leg RDL',  sets: 3, reps: '10 / side', rpe: 'RPE 12', rest: 90, restLabel: '90 s', note: '' },
    ]
  }
];

const CAT_LABELS = { push: 'Horizontal push', pull: 'Vertical pull', hinge: 'Hinge–squat' };
let state = {};
let timers = {};
let activeDay = 0;

function storageKey(day, ex, set, field) {
  const d = new Date().toISOString().slice(0,10);
  return `gt_${d}_d${day}_e${ex}_s${set}_${field}`;
}

function histKey(day) {
  const d = new Date().toISOString().slice(0,10);
  return `gt_hist_${d}_d${day}`;
}

function buildDay(dayIdx) {
  const day = DAYS[dayIdx];
  const container = document.getElementById('day'+dayIdx);
  container.innerHTML = '';

  const lbl = document.createElement('div');
  lbl.className = 'session-label';
  lbl.textContent = day.label;
  container.appendChild(lbl);

  day.exercises.forEach((ex, ei) => {
    const card = document.createElement('div');
    card.className = 'ex-card';

    const hdr = document.createElement('div');
    hdr.className = 'ex-header';
    hdr.innerHTML = `
      <div class="ex-cat-row"><div class="cat-dot dot-${ex.cat}"></div><div class="ex-cat">${CAT_LABELS[ex.cat]}</div></div>
      <div class="ex-name">${ex.name}</div>`;
    card.appendChild(hdr);

    const params = document.createElement('div');
    params.className = 'ex-params';
    params.innerHTML = `
      <span class="param-pill accent">${ex.sets} sets</span>
      <span class="param-pill">${ex.reps} reps</span>
      <span class="param-pill">${ex.rpe}</span>
      <span class="param-pill">${ex.restLabel} rest</span>`;
    card.appendChild(params);

    if (ex.note) {
      const note = document.createElement('div');
      note.className = 'ex-note';
      note.textContent = ex.note;
      card.appendChild(note);
    }

    const setsSec = document.createElement('div');
    setsSec.className = 'sets-section';
    const setsHdr = document.createElement('div');
    setsHdr.className = 'sets-header';
    setsHdr.innerHTML = `<span class="sets-title">Log sets</span>`;
    const resetBtn = document.createElement('button');
    resetBtn.className = 'sets-reset';
    resetBtn.textContent = 'Reset';
    resetBtn.onclick = () => resetExercise(dayIdx, ei);
    setsHdr.appendChild(resetBtn);
    setsSec.appendChild(setsHdr);

    const rowsDiv = document.createElement('div');
    rowsDiv.className = 'set-rows';
    rowsDiv.id = `rows-${dayIdx}-${ei}`;
    setsSec.appendChild(rowsDiv);
    card.appendChild(setsSec);

    const restBar = document.createElement('div');
    restBar.className = 'rest-bar';
    restBar.innerHTML = `
      <span class="rest-label" id="rlabel-${dayIdx}-${ei}">Rest timer</span>
      ${ex.altRestLabel ? `<button class="rest-btn" id="rbtn2-${dayIdx}-${ei}" onclick="startRest(${dayIdx},${ei},${ex.altRest},'rbtn2-${dayIdx}-${ei}')">${ex.altRestLabel}</button>` : ''}
      <button class="rest-btn" id="rbtn-${dayIdx}-${ei}" onclick="startRest(${dayIdx},${ei},${ex.rest},'rbtn-${dayIdx}-${ei}')">${ex.restLabel}</button>
      <span class="timer-display" id="rtimer-${dayIdx}-${ei}"></span>`;
    card.appendChild(restBar);

    container.appendChild(card);
    buildSetRows(dayIdx, ei);
  });

  const banner = document.createElement('div');
  banner.className = 'done-banner';
  banner.id = `done-${dayIdx}`;
  banner.innerHTML = `<span class="done-icon">✓</span><span class="done-text">Session complete. Nice work.</span>`;
  container.appendChild(banner);
}

function buildSetRows(dayIdx, ei) {
  const ex = DAYS[dayIdx].exercises[ei];
  const container = document.getElementById(`rows-${dayIdx}-${ei}`);
  container.innerHTML = '';
  for (let s = 0; s < ex.sets; s++) {
    const wKey = storageKey(dayIdx, ei, s, 'w');
    const rKey = storageKey(dayIdx, ei, s, 'r');
    const dKey = storageKey(dayIdx, ei, s, 'd');
    const weight = localStorage.getItem(wKey) || '';
    const reps = localStorage.getItem(rKey) || '';
    const done = localStorage.getItem(dKey) === '1';

    const row = document.createElement('div');
    row.className = 'set-row';

    const num = document.createElement('span');
    num.className = 'set-num';
    num.textContent = s + 1;

    const check = document.createElement('div');
    check.className = 'set-check' + (done ? ' done' : '');
    check.onclick = () => {
      const isDone = localStorage.getItem(dKey) === '1';
      localStorage.setItem(dKey, isDone ? '0' : '1');
      buildSetRows(dayIdx, ei);
      checkAllDone(dayIdx);
    };

    const wInput = document.createElement('input');
    wInput.className = 'set-input';
    wInput.type = 'number';
    wInput.inputMode = 'decimal';
    wInput.placeholder = 'kg';
    wInput.value = weight;
    wInput.onchange = e => localStorage.setItem(wKey, e.target.value);

    const sep = document.createElement('span');
    sep.className = 'set-sep';
    sep.textContent = '×';

    const rInput = document.createElement('input');
    rInput.className = 'set-input';
    rInput.type = 'number';
    rInput.inputMode = 'numeric';
    rInput.placeholder = 'reps';
    rInput.value = reps;
    rInput.onchange = e => localStorage.setItem(rKey, e.target.value);

    row.append(num, check, wInput, sep, rInput);
    container.appendChild(row);
  }
}

function resetExercise(dayIdx, ei) {
  const ex = DAYS[dayIdx].exercises[ei];
  for (let s = 0; s < ex.sets; s++) {
    localStorage.removeItem(storageKey(dayIdx, ei, s, 'w'));
    localStorage.removeItem(storageKey(dayIdx, ei, s, 'r'));
    localStorage.removeItem(storageKey(dayIdx, ei, s, 'd'));
  }
  buildSetRows(dayIdx, ei);
  checkAllDone(dayIdx);
}

function checkAllDone(dayIdx) {
  const day = DAYS[dayIdx];
  const allDone = day.exercises.every((ex, ei) => {
    for (let s = 0; s < ex.sets; s++) {
      if (localStorage.getItem(storageKey(dayIdx, ei, s, 'd')) !== '1') return false;
    }
    return true;
  });
  const banner = document.getElementById(`done-${dayIdx}`);
  if (banner) banner.className = 'done-banner' + (allDone ? ' show' : '');
  if (allDone) saveHistory(dayIdx);
}

function saveHistory(dayIdx) {
  const day = DAYS[dayIdx];
  const data = { day: dayIdx, label: day.label, exercises: [] };
  day.exercises.forEach((ex, ei) => {
    const sets = [];
    for (let s = 0; s < ex.sets; s++) {
      const w = localStorage.getItem(storageKey(dayIdx, ei, s, 'w'));
      const r = localStorage.getItem(storageKey(dayIdx, ei, s, 'r'));
      if (w || r) sets.push({ w: w || '—', r: r || '—' });
    }
    if (sets.length) data.exercises.push({ name: ex.name, sets });
  });
  localStorage.setItem(histKey(dayIdx), JSON.stringify(data));
}

function startRest(dayIdx, ei, secs, btnId) {
  const timerKey = `${dayIdx}-${ei}`;
  if (timers[timerKey]) clearInterval(timers[timerKey]);
  document.querySelectorAll(`[id^="rbtn-${dayIdx}-${ei}"], [id^="rbtn2-${dayIdx}-${ei}"]`).forEach(b => b.classList.remove('active'));
  document.getElementById(btnId).classList.add('active');
  const display = document.getElementById(`rtimer-${dayIdx}-${ei}`);
  const label = document.getElementById(`rlabel-${dayIdx}-${ei}`);
  let rem = secs;
  function tick() {
    if (rem <= 0) {
      clearInterval(timers[timerKey]);
      display.textContent = '';
      display.className = 'timer-display';
      document.getElementById(btnId).classList.remove('active');
      label.textContent = 'Rest done!';
      setTimeout(() => { label.textContent = 'Rest timer'; }, 2500);
      return;
    }
    const m = Math.floor(rem / 60);
    const s = rem % 60;
    display.textContent = m > 0 ? `${m}:${s < 10 ? '0' : ''}${s}` : `${s}s`;
    display.className = rem <= 10 ? 'timer-display timer-done' : 'timer-display';
    rem--;
  }
  tick();
  timers[timerKey] = setInterval(tick, 1000);
}

function showDay(d) {
  activeDay = d;
  [0,1,2].forEach(i => {
    document.getElementById('day'+i).style.display = i === d ? '' : 'none';
    document.getElementById('tab'+i).className = 'tab-btn' + (i === d ? ' active' : '');
  });
}

function toggleHistory() {
  const panel = document.getElementById('hist-panel');
  const icon = document.getElementById('hist-icon');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open', !isOpen);
  icon.classList.toggle('open', !isOpen);
  if (!isOpen) renderHistory();
}

function renderHistory() {
  const panel = document.getElementById('hist-panel');
  panel.innerHTML = '';
  const keys = Object.keys(localStorage).filter(k => k.startsWith('gt_hist_')).sort().reverse();
  if (!keys.length) {
    panel.innerHTML = '<div class="history-empty">No completed sessions yet.</div>';
    return;
  }
  keys.slice(0, 20).forEach(k => {
    const data = JSON.parse(localStorage.getItem(k));
    const dateStr = k.split('_')[2];
    const entry = document.createElement('div');
    entry.className = 'history-entry';
    const dayNames = ['Monday', 'Wednesday', 'Friday'];
    let html = `<div class="history-date">${dateStr} · ${dayNames[data.day] || ''}</div>`;
    data.exercises.forEach(ex => {
      html += `<div class="history-row"><strong>${ex.name}</strong></div>`;
      ex.sets.forEach((s, i) => {
        html += `<div class="history-row" style="padding-left:10px;color:var(--text2)">Set ${i+1}: ${s.w} kg × ${s.r} reps</div>`;
      });
    });
    entry.innerHTML = html;
    panel.appendChild(entry);
  });
}

function clearHistory() {
  if (!confirm('Clear all saved history? This cannot be undone.')) return;
  Object.keys(localStorage).filter(k => k.startsWith('gt_')).forEach(k => localStorage.removeItem(k));
  [0,1,2].forEach(i => buildDay(i));
  renderHistory();
}

function setTodayLabel() {
  const d = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('today-label').textContent = `${days[d.getDay()]} ${d.toLocaleDateString('en-US', {month:'short', day:'numeric'})}`;
}

function autoSelectDay() {
  const dow = new Date().getDay();
  if (dow === 1) showDay(0);
  else if (dow === 3) showDay(1);
  else if (dow === 5) showDay(2);
  else showDay(0);
}

[0,1,2].forEach(buildDay);
setTodayLabel();
autoSelectDay();
[0,1,2].forEach(i => checkAllDone(i));
</script>
</body>
</html>
